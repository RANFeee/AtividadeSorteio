<!DOCTYPE html>
<html>

<head>
    <title>Sorteio</title>
    <link href="sorteio.css" rel="stylesheet" />
</head>

<body>

    <form onsubmit="adicionarParticipante(event);">
        <label for="input_nome">Nome:</label>
        <input type="text" id="input_nome" required minlength="2" />
        <button type="submit" id="btn_enviar">
            Adicionar
        </button>
    </form>

    <div>
        <table>
            <thead>
                <tr>
                    <td>Id</td>
                    <td>Nome</td>
                    <td>Ação</td>
                    <td><button type="button" onclick="ordenarNomeCrescente()">Ordem Crescente</button></td>
                    <td><button type="button" onclick="ordenarNomeDecrescente()">Ordem Decrescente</button></td>
                </tr>
            </thead>

            <tbody id="lista">
                <tr>
                    <td colspan="3">Nenhum participante</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <button id="sortear" type="button" onclick="sortear()">
            Sortear
        </button>
    </div>

    <script src="sorteio.js"></script>

</body>

</html>
